<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equibal Mini Banking System</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body class="desktop">
  <div id="q-app">
    <div class="q-layout q-layout--standard">
      <!-- HEADER -->
      <header class="q-header q-layout__section--marginal fixed-top bg-primary text-white">
        <div class="q-toolbar row no-wrap items-center">
          <button class="q-btn q-btn--flat q-btn--round q-btn--dense" id="btn-toggle-drawer" title="Toggle Menu">
            <span class="q-icon">
              <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </span>
          </button>
          
          <div class="q-toolbar__title text-h6 text-weight-bold">
            Equibal Mini Banking System
          </div>

          <div class="q-space"></div>

          <!-- USER CHIP / ROLE SWITCHER -->
          <div class="q-chip q-chip--dense bg-blue-2 text-primary q-mr-sm" style="padding: 4px 12px; display: inline-flex; align-items: center;">
            <span class="q-icon q-chip__icon q-chip__icon--left" style="margin-right: 6px;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            </span>
            <select id="role-select" style="background: transparent; border: none; font-weight: 700; color: #1976D2; cursor: pointer; outline: none; font-size: 13px; font-family: inherit;">
              <option value="admin">Administrator (System Admin)</option>
              <option value="staff">Staff Member (Bank Teller)</option>
              <option value="customer">Customer User (Client)</option>
            </select>
          </div>

          <!-- LOGOUT BTN -->
          <button class="q-btn q-btn--flat q-btn--round q-btn--dense" id="btn-logout" title="Log Out">
            <span class="q-icon">
              <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            </span>
          </button>
        </div>
      </header>

      <!-- DRAWER / SIDEBAR -->
      <aside class="q-drawer q-drawer--left fixed bg-grey-1" id="drawer">
        <div class="q-drawer__content scroll">
          <div class="q-list">
            
            <!-- SECTION 1: NAVIGATION -->
            <div class="q-item-label q-item-label--header text-grey-7 text-uppercase text-weight-bold">
              Navigation
            </div>
            
            <a class="q-item q-item--link q-item--active text-primary bg-blue-1" data-nav="dashboard">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Dashboard</div>
              </div>
            </a>

            <div class="q-separator q-my-sm"></div>

            <!-- SECTION 2: SYSTEM CONFIGURATION -->
            <div class="q-item-label q-item-label--header text-grey-7 text-uppercase text-weight-bold">
              System Configuration
            </div>

            <a class="q-item q-item--link" data-nav="roles">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Roles</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="account_types">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Account Types</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="banks">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zm-4.5-9L2 6v2h19V6l-9.5-5z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Banks</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="fee_types">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4 4 5.57 4 7.5 5.57 11 7.5 11zm0-5C8.33 6 9 6.67 9 7.5S8.33 9 7.5 9 6 8.33 6 7.5 6.67 6 7.5 6zm9 13c1.93 0 3.5-1.57 3.5-3.5S18.43 12 16.5 12 13 13.57 13 15.5s1.57 3.5 3.5 3.5zm0-5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zM4.05 18.55l14.5-14.5 1.41 1.41L5.46 19.96z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Fee Types</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="users">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Users</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="audit_logs">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Audit Logs</div>
              </div>
            </a>

            <div class="q-separator q-my-sm"></div>

            <!-- SECTION 3: BANKING OPERATIONS -->
            <div class="q-item-label q-item-label--header text-grey-7 text-uppercase text-weight-bold">
              Banking Operations
            </div>

            <a class="q-item q-item--link" data-nav="accounts">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-12-3h8v-2H8v2z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Accounts</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="withdrawal_limits">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Withdrawal Limits</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="interest_policies">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Interest Policies</div>
              </div>
            </a>

            <a class="q-item q-item--link" data-nav="reports">
              <div class="q-item__section q-item__section--avatar">
                <span class="q-icon">
                  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                </span>
              </div>
              <div class="q-item__section">
                <div class="q-item__label">Reports</div>
              </div>
            </a>

          </div>
        </div>
      </aside>

      <!-- MAIN PAGE CONTAINER -->
      <main class="q-page-container">
        <div class="q-page q-pa-md">
          
          <!-- WELCOME CARD -->
          <div class="q-card q-card--bordered shadow-1 q-mb-md">
            <div class="q-card__section">
              <div class="text-h5 text-weight-bold text-grey-9" id="welcome-title">
                Welcome, System Admin
              </div>
            </div>
          </div>

          <!-- 4 STAT CARDS ROW -->
          <div class="row q-col-gutter-md q-mb-lg">
            <!-- CARD 1: ROLES -->
            <div class="col-12 col-sm-6 col-md-3">
              <div class="q-card q-card--bordered shadow-1 stat-card" data-stat="roles">
                <div class="stat-card__icon bg-blue-1 text-primary">
                  <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <div class="stat-card__content">
                  <div class="stat-card__val text-h4 text-weight-bold" id="stat-roles-val">4</div>
                  <div class="stat-card__lbl text-subtitle2 text-grey-7">Roles</div>
                </div>
              </div>
            </div>

            <!-- CARD 2: USERS -->
            <div class="col-12 col-sm-6 col-md-3">
              <div class="q-card q-card--bordered shadow-1 stat-card" data-stat="users">
                <div class="stat-card__icon bg-blue-1 text-primary">
                  <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <div class="stat-card__content">
                  <div class="stat-card__val text-h4 text-weight-bold" id="stat-users-val">3</div>
                  <div class="stat-card__lbl text-subtitle2 text-grey-7">Users</div>
                </div>
              </div>
            </div>

            <!-- CARD 3: ACCOUNTS -->
            <div class="col-12 col-sm-6 col-md-3">
              <div class="q-card q-card--bordered shadow-1 stat-card" data-stat="accounts">
                <div class="stat-card__icon bg-blue-1 text-primary">
                  <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <div class="stat-card__content">
                  <div class="stat-card__val text-h4 text-weight-bold" id="stat-accounts-val">2</div>
                  <div class="stat-card__lbl text-subtitle2 text-grey-7">Accounts</div>
                </div>
              </div>
            </div>

            <!-- CARD 4: REGISTERED ITEMS -->
            <div class="col-12 col-sm-6 col-md-3">
              <div class="q-card q-card--bordered shadow-1 stat-card" data-stat="banks">
                <div class="stat-card__icon bg-blue-1 text-primary">
                  <svg viewBox="0 0 24 24"><path d="M4 10v7h3v-7H4zm6 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zm-4.5-9L2 6v2h19V6l-9.5-5z"/></svg>
                </div>
                <div class="stat-card__content">
                  <div class="stat-card__val text-h4 text-weight-bold" id="stat-banks-val">1</div>
                  <div class="stat-card__lbl text-subtitle2 text-grey-7">Registered Items</div>
                </div>
              </div>
            </div>
          </div>

          <!-- DYNAMIC DATA TABLE / WORKSPACE -->
          <div class="q-card q-card--bordered shadow-1">
            <div class="q-card__section row items-center justify-between q-py-md">
              <div class="text-h6 text-weight-bold text-grey-8" id="view-title">
                Overview &amp; Managed Entities
              </div>
              <div class="row items-center q-gutter-sm">
                <input type="text" class="q-field__native" id="search-input" placeholder="Filter records...">
                <button class="q-btn bg-primary text-white q-px-md" id="btn-add-entity">
                  + Add New
                </button>
              </div>
            </div>
            <div class="q-separator"></div>
            <div class="q-table__container scroll">
              <table class="q-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/app.js"></script>
</body>
</html>
